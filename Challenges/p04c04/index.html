<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Target Sandbox - Inspect the URL</title>
  <style>
    body { background: #0b0f19; color: #00ff9d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 2rem; margin: 0; }
    .box { border: 1px solid rgba(0,255,157,0.3); padding: 2rem; border-radius: 12px; background: rgba(0,255,157,0.05); margin-top: 1.5rem; }
    code { font-size: 1.2rem; color: #fff; background: rgba(255,255,255,0.1); padding: 0.25rem 0.5rem; border-radius: 4px; font-family: 'Fira Code', monospace; }
  </style>
  <script>
    function evaluateUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const val = (params.get('show_flag') || '').toLowerCase().trim();
      const container = document.getElementById('flag-container');
      if (!container) return;

      if (val === 'true' || val === '1' || val === 'yes') {
        container.innerHTML = `
          <div style="background: rgba(0, 255, 157, 0.12); border: 2px solid #00ff9d; padding: 1.5rem; border-radius: 8px; margin-top: 1rem;">
            <h2 style="color: #00ff9d; margin-top: 0; font-size: 1.5rem;">🎉 Flag Unlocked!</h2>
            <p style="font-size: 1rem; color: #e2e8f0; margin-bottom: 0.75rem;">Copy this flag and submit it in the XCTF platform:</p>
            <code style="font-size: 1.3rem; color: #00f0ff; background: #080b11; padding: 0.75rem 1.25rem; border-radius: 6px; display: inline-block; border: 1px solid rgba(0,240,255,0.4); user-select: all;">XCTF{url_parameters_are_visible_2026}</code>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div style="background: rgba(255, 42, 95, 0.1); border: 1px solid #ff2a5f; padding: 1.5rem; border-radius: 8px; margin-top: 1rem;">
            <h3 style="color: #ff2a5f; margin-top: 0; font-size: 1.2rem;">⚠️ Flag is Hidden!</h3>
            <p style="color: #cbd5e1; font-size: 0.95rem;">Web applications read data passed in the URL address bar as query parameters.</p>
            <p style="color: #ffb703; font-weight: 600; font-size: 1rem; margin-bottom: 0;">Look at your browser address bar URL right now: Change <code>show_flag=false</code> to <code>show_flag=true</code> in your address bar and press Enter!</p>
          </div>
        `;
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', evaluateUrlParams);
    } else {
      evaluateUrlParams();
    }
    window.addEventListener('load', evaluateUrlParams);
  </script>
</head>
<body>

<!-- XCTF Target Sandbox Navigation Header -->
<div id="xctf-target-nav-banner" style="position: sticky; top: 0; left: 0; right: 0; width: 100%; background: #080b11; border-bottom: 1px solid rgba(0, 240, 255, 0.3); padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; z-index: 999999; box-shadow: 0 4px 20px rgba(0,0,0,0.5); box-sizing: border-box;">
  <div style="display: flex; align-items: center; gap: 0.75rem;">
    <span style="font-weight: 800; color: #00f0ff; letter-spacing: 1px; font-size: 0.9rem;">🛡️ XCTF TARGET SANDBOX</span>
    <span style="background: rgba(0, 240, 255, 0.1); color: #00ff9d; font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 4px; border: 1px solid rgba(0, 255, 157, 0.3);">ACTIVE SESSION</span>
  </div>
  <a id="xctf-return-to-challenge-btn" href="/challenges" style="background: #00f0ff; color: #080b11; font-weight: 700; text-decoration: none; padding: 0.5rem 1.25rem; border-radius: 6px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s ease; cursor: pointer;" onmouseover="this.style.background='#00ff9d'" onmouseout="this.style.background='#00f0ff'">
    ⬅ Return to Challenge & Submit Flag
  </a>
</div>
<script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const cId = params.get('challengeId') || params.get('id');
    const miniCtfId = params.get('miniCtfId') || params.get('mini_ctf_id');
    const returnBtn = document.getElementById('xctf-return-to-challenge-btn');
    if (returnBtn) {
      const baseUrl = window.location.origin;
      if (miniCtfId) {
        returnBtn.textContent = '⬅ Return to Mini CTF & Submit Flag';
        returnBtn.href = baseUrl + '/mini-ctf/' + miniCtfId + (cId ? '?challengeId=' + cId : '');
      } else if (cId) {
        returnBtn.textContent = '⬅ Return to Challenge & Submit Flag';
        returnBtn.href = baseUrl + '/challenges?challengeId=' + cId;
      } else {
        returnBtn.textContent = '⬅ Return to Challenge & Submit Flag';
        returnBtn.href = baseUrl + '/challenges';
      }
    }
  })();
</script>

  <div style="padding: 0 1.5rem;">
    <div class="box">
      <h1 style="color: #fff; margin-top: 0;">Beginner Mission: Inspect the URL</h1>
      <p style="color: #94a3b8; font-size: 1rem;">Web applications read data passed in the URL address bar as URL query parameters.</p>
      <div id="flag-container"></div>
    </div>
  </div>
</body>
</html>
